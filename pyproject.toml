[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelforge"
version = "0.1.0"
description = "Convert image folders into cinematic vertical social-media videos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "ReelForge Contributors" },
]
keywords = [
    "video",
    "reels",
    "shorts",
    "tiktok",
    "ken-burns",
    "ffmpeg",
    "slideshow",
    "social-media",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "tqdm>=4.66.0",
    "natsort>=8.4.0",
]

[project.optional-dependencies]
moviepy = ["moviepy>=1.0.3"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-Pillow>=10.2.0",
    "types-tqdm>=4.66.0",
    "pre-commit>=3.6.0",
]
all = ["reelforge[moviepy,dev]"]

[project.scripts]
reelforge = "reelforge.cli.main:run"

[project.urls]
Homepage = "https://github.com/reelforge/reelforge"
Documentation = "https://github.com/reelforge/reelforge#readme"
Repository = "https://github.com/reelforge/reelforge"
Issues = "https://github.com/reelforge/reelforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["reelforge"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["reelforge", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length handled by black
    "RUF001", # allow unicode in CLI output
    "RUF002", # en-dash in docstrings is fine
    "RUF003",
    "RUF046", # int(round(...)) kept for clarity with float math
]

[tool.ruff.lint.per-file-ignores]
"reelforge/cli/**/*.py" = ["B008"]  # Typer Option defaults are idiomatic
"tests/**/*.py" = ["ARG"]


[tool.ruff.lint.isort]
known-first-party = ["reelforge"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["reelforge"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "moviepy.*",
    "natsort.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["reelforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
