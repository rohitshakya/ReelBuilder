description: High-contrast dark theme with zoom transitions.
animation:
  type: kenburns
  movement: zoom_in
  duration: 2.8
  zoom_factor: 1.20
transition:
  type: zoom
  duration: 0.5
progress_bar:
  enabled: true
  height: 5
  color: "#00E5FF"
  show_counter: true
colors:
  accent: "#00E5FF"
  background: "#050505"
